workflows:
  android-debug:
    name: Hijama Guide — Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Flutter packages
        script: |
          cd hijama_app
          flutter pub get

      - name: Build Debug APK
        script: |
          cd hijama_app
          flutter build apk --debug

    artifacts:
      - hijama_app/build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - DEINE_EMAIL_HIER@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Hijama Guide — Android Release APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Flutter packages
        script: |
          cd hijama_app
          flutter pub get

      - name: Build Release APK
        script: |
          cd hijama_app
          flutter build apk --release

    artifacts:
      - hijama_app/build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - giannitifeki@gmail.com
        notify:
          success: true
          failure: true
