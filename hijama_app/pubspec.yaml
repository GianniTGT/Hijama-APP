name: hijama_guide
description: Hijama / Cupping Guide nach der Sunnah — islamischer Kalender & Tagebuch
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Hijri calendar (Islamic calendar conversion)
  hijri: ^3.0.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Local storage (language preference, local cache)
  shared_preferences: ^2.3.2

  # Notifications (Sunnah day reminders)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # State management
  provider: ^6.1.2

  # UI extras
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true  # enables flutter_localizations

  assets:
    - assets/l10n/de.json
    - assets/l10n/en.json
    - assets/l10n/sq.json
    - assets/l10n/ar.json

  # fonts:
  #   - family: Scheherazade
  #     fonts:
  #       - asset: assets/fonts/ScheherazadeNew-Regular.ttf
  #         (Download from https://fonts.google.com/specimen/Scheherazade+New)
