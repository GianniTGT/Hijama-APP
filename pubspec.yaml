name: hijama_guide
description: Hijama Guide – islamische Schröpftherapie nach der Sunnah
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9
  firebase_messaging: ^14.7.20

  # State Management
  provider: ^6.1.2

  # Calendar & Date
  hijri: ^2.0.1
  table_calendar: ^3.1.1
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # Storage
  shared_preferences: ^2.2.3

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/l10n/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
